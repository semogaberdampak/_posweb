<!-- Favicon keranjang belanja dengan animasi rotasi perlahan -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="16" height="16">
  <animateTransform
    attributeName="transform"
    type="rotate"
    from="0 32 32"
    to="360 32 32"
    dur="25s"
    repeatCount="indefinite"/>
  <g>
    <path
      d="M22 2h10v4H22zM7 2v4h10V2zm10 4h4v16h-4z"
      stroke="none"
      fill="#8a5a1f"/>
    <circle cx="32" cy="32" r="26" fill="none" stroke="#8a5a1f" stroke-width="5"/>
    <line x1="24" y1="20" x2="24" y2="10"/>
    <line x1="40" y1="20" x2="40" y2="10"/>
  </g>
</svg>